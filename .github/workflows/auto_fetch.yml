name: Auto fetch MOPS (relay)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        idx: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: |
          ARG=$(python3 auto_slice.py ${{ matrix.idx }} 4 60)
          echo "本工作日期：$ARG"
          if [ -n "$ARG" ]; then timeout 52m python3 fetch_year.py "$ARG" x || true; fi
      - if: always()
        run: |
          gzip -f data/announcements_*.csv || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add raw data && git commit -m "auto fetch job ${{ matrix.idx }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 30 + 5)); done
