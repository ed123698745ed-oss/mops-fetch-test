name: 058 T FinMind fetch
on:
  push:
    branches: [main]
    paths: ["p058/fetch_fm_t.py", ".github/workflows/p058_fm_t.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: timeout 52m python3 p058/fetch_fm_t.py ${{ matrix.k }} 3 || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out/p058 && git commit -q -m "058 T finmind slice ${{ matrix.k }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
