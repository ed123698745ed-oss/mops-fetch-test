name: Fetch MOPS daily announcements
on:
  workflow_dispatch:
    inputs:
      year:
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_year.py ${{ inputs.year }}
      - if: always()
        run: |
          gzip -f data/announcements_${{ inputs.year }}.csv || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add raw data && git commit -m "MOPS ${{ inputs.year }} [skip ci]" && git pull --rebase && git push
