name: 058 FinMind corporate actions
on:
  push:
    branches: [main]
    paths: ["p058/fetch_ca.py", ".github/workflows/p058_ca.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: timeout 52m python3 p058/fetch_ca.py || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out/p058/ca && git commit -q -m "058 corporate actions [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
