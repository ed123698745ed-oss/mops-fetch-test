name: 054 financial report corrections
on:
  push:
    branches: [main]
    paths: ["p054/corr_urls.txt", "p054/fetch_corr.py", ".github/workflows/p054_corr.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: timeout 50m python3 p054/fetch_corr.py || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out/p054/corr out/p054/corr_log.txt && git commit -q -m "054 corrections [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
