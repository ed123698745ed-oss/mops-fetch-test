name: p076 聯合新聞網關鍵字搜尋
on:
  push:
    paths: [".github/workflows/p076_udn.yml", "p076/udn_fetch.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: timeout 80m python3 p076/udn_fetch.py || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add p076 && git commit -m "p076 聯合新聞網搜尋結果 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
