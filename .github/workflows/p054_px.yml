name: 054 FinMind prices
on:
  push:
    branches: [main]
    paths: ["p054/fetch_px.py", ".github/workflows/p054_px.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  px:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 p054/fetch_px.py || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out/p054/px out/p054/px_log.txt && git commit -q -m "054 FinMind prices [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
