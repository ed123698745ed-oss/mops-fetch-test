name: 054 delisted pdf fetch
on:
  push:
    branches: [main]
    paths: ["p054/pdf_list.txt", "p054/fetch_pdf.py", ".github/workflows/p054_pdf.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p054-pdf
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: timeout 52m python3 p054/fetch_pdf.py || true
      - if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out/p054/pdftxt out/p054/pdf_log.txt && git commit -q -m "054 delisted pdf text [skip ci]" || exit 0
          for i in $(seq 1 12); do git pull -q --rebase -X theirs origin main || { git rebase --abort; sleep 5; continue; }; git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
