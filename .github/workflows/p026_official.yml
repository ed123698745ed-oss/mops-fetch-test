name: p026 official daily quotes
on:
  push:
    branches: [p026-official]
    paths: [p026/official_need_all.txt, p026/fetch_official.py, .github/workflows/p026_official.yml]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - run: python p026/fetch_official.py p026/official_need_all.txt ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/p026_official
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: |
          mkdir -p out/p026_official && cp -n art/*/* out/p026_official/ || true
          git config user.name "p026-bot"; git config user.email "p026-bot@users.noreply.github.com"
          git add out/p026_official && git commit -m "p026 official daily quotes (all) [skip ci]" && git push || echo nothing
