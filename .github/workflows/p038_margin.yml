name: 038 TWSE margin (pre-period)
on:
  push:
    paths: ["p038/dates_twse.txt", "p038/fetch_margin.py", ".github/workflows/p038_margin.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 p038/fetch_margin.py | tee p038/fetch_log.txt || true
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add p038 && git commit -m "038 margin fetch [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
