name: p076 補抓重訊 20261013-20261031
on:
  push:
    paths: [".github/workflows/p076_fetch.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: timeout 60m python3 fetch_year.py 20261013 20261031 || true
      - if: always()
        run: |
          gzip -f data/announcements_*.csv || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add raw data && git commit -m "p076 MOPS 20261013-20261031 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
